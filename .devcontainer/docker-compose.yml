version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/counterfactuals:cached
    # Using 'service:redis' for network_mode makes redis available on localhost
    # inside the app container, matching the project's Celery configuration.
    network_mode: service:redis
    depends_on:
      - redis
    command: /bin/sh -c "while sleep 1000; do :; done"

  redis:
    image: redis:alpine
    restart: always
